[workspace]
members = [
  "core",
  "workspace",
  "engine-protocol",
  "ai-provider-protocol",
  "notebook",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/chasebryan/FCF-Laboratory"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
